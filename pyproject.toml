[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "AIE2026 演習・宿題用リポジトリ（学習支援エージェントを育てる）"
readme = "README.md"
requires-python = ">=3.12"
# 年度中に壊れないよう、バージョンは固定する
dependencies = [
    "google-adk[mcp]>=2.14.0",
    "google-genai==2.31.0",
    # MCP SDK 1.x is used by ADK and the FastMCP server in app/mcp_server.py.
    "mcp>=1.30,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
